<html lang="es">

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mi corretaje · Inmuebles Asunción</title>
    <meta
      name="description"
      content="Calculadora de comisión del agente inmobiliario: venta o alquiler, en dólar, guaraní y real."
    />
    <meta name="robots" content="noindex" />

<style>
      /* Cores oficiais da Century 21: Obsessed Grey #252526 e Relentless
         Gold #BEAF88 — as mesmas do painel em /admin/corretagem. */
      :root {
        color-scheme: light;
        --bg: #fafaf9;
        --fg: #1c1917;
        --card: #ffffff;
        --border: #e7e5e4;
        --muted: #78716c;
        --brand: #252526;
        --brand-contrast: #ffffff;
        --heading: #000000;
        --gold: #beaf88;
        --danger: #dc2626;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #18181b;
        --fg: #f4f4f5;
        --card: #1c1917;
        --border: #292524;
        --muted: #a8a29e;
        --brand: #6b6b6e;
        --brand-contrast: #ffffff;
        --heading: #beaf88;
        --gold: #beaf88;
        --danger: #f87171;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        line-height: 1.5;
      }
      header {
        border-bottom: 1px solid var(--border);
        background: var(--card);
      }
      .bar,
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 16px;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .brand {
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--heading);
      }
      main {
        padding-block: 28px 48px;
      }
      h1 {
        margin: 0;
        font-size: 1.6rem;
        color: var(--heading);
      }
      .intro {
        margin: 6px 0 24px;
        color: var(--muted);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 20px;
      }
      fieldset {
        border: 0;
        margin: 0;
        padding: 0;
      }
      legend,
      .label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 6px;
        padding: 0;
      }
      .segmented {
        display: flex;
        gap: 8px;
      }
      .segmented label {
        flex: 1;
        text-align: center;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--muted);
        cursor: pointer;
        transition: 0.15s;
      }
      .segmented input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }
      .segmented label:has(input:checked) {
        background: var(--brand);
        border-color: var(--brand);
        color: var(--brand-contrast);
      }
      .segmented label:has(input:focus-visible) {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      .dois-lados {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-top: 14px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        cursor: pointer;
      }
      .dois-lados:hover {
        border-color: var(--gold);
      }
      .dois-lados:has(input:checked) {
        border-color: var(--brand);
      }
      .dois-lados:has(input:focus-visible) {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      .dois-lados input {
        margin: 2px 0 0;
        width: 17px;
        height: 17px;
        accent-color: var(--brand);
        flex-shrink: 0;
      }
      .dois-lados-titulo {
        display: block;
        font-size: 0.9rem;
        font-weight: 500;
      }
      .dois-lados-dica {
        display: block;
        margin-top: 2px;
        font-size: 0.82rem;
        color: var(--muted);
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 16px;
      }
      .row > div:first-child {
        flex: 1 1 200px;
      }
      input[type="text"],
      input[type="number"],
      select {
        width: 100%;
        padding: 10px 12px;
        font-size: 0.95rem;
        font-family: inherit;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--fg);
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 2px var(--gold);
      }
      .erro {
        margin: 12px 0 0;
        font-size: 0.875rem;
        color: var(--danger);
      }
      .resultado-rotulo {
        margin: 0;
        font-size: 0.875rem;
        color: var(--muted);
      }
      .resultado {
        margin: 4px 0 0;
        font-size: 2.4rem;
        font-weight: 700;
        color: var(--heading);
        line-height: 1.15;
        overflow-wrap: anywhere;
      }
      .regra {
        margin: 8px 0 0;
        font-size: 0.9rem;
        color: var(--muted);
      }
      .cascata {
        margin: 18px 0 0;
        padding-top: 18px;
        border-top: 1px solid var(--border);
      }
      .cascata dl {
        margin: 0;
        display: grid;
        gap: 8px;
        font-size: 0.9rem;
      }
      .cascata dl > div {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .cascata dt {
        color: var(--muted);
      }
      .cascata dd {
        margin: 0;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
      }
      .cascata .repasse dd {
        color: var(--muted);
      }
      .cascata .teto dt,
      .cascata .teto dd {
        color: var(--gold);
      }
      .cascata .liquido {
        border-top: 1px solid var(--border);
        padding-top: 8px;
      }
      .cascata .liquido dt,
      .cascata .liquido dd {
        color: var(--fg);
        font-weight: 600;
      }

      .equivalencias {
        margin: 20px 0 0;
        padding-top: 20px;
        border-top: 1px solid var(--border);
      }
      .equivalencias dl {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        margin: 8px 0 0;
      }
      .equivalencias dt {
        font-size: 0.875rem;
        color: var(--muted);
      }
      .equivalencias dd {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
      }
      details.cotacoes summary {
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
      }
      details.cotacoes .row {
        margin-top: 12px;
      }
      details.cotacoes .row > div {
        flex: 1 1 180px;
      }
      .acoes {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      button {
        font-family: inherit;
        font-size: 0.85rem;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      button:hover {
        border-color: var(--brand);
      }
      .nota {
        font-size: 0.8rem;
        color: var(--muted);
        margin: 10px 0 0;
      }

      /* Seletor de idioma ------------------------------------------- */
      .idiomas {
        display: flex;
        gap: 4px;
      }
      .idiomas button {
        padding: 5px 10px;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .idiomas button:hover {
        color: var(--fg);
      }
      .idiomas button[aria-pressed="true"] {
        background: var(--brand);
        border-color: var(--brand);
        color: var(--brand-contrast);
      }
      .idiomas button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 1px;
      }

      /* Cotações (somente leitura, vindas do Brascambio) -------------- */
      .cotacoes-info {
        display: grid;
        gap: 10px;
      }
      .cotacoes-linha {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px 16px;
      }
      .cotacoes-par {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .cotacoes-carimbo {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .cotacoes-info a {
        color: var(--heading);
      }

      footer {
        max-width: 760px;
        margin: 0 auto;
        padding: 0 16px 40px;
        font-size: 0.8rem;
        color: var(--muted);
      }
      [hidden] {
        display: none !important;
      }
    </style>  </head>
  <body>
    <header>
      <div class="bar">
        <span class="brand" data-t="marca">Imóveis Assunção</span>
        <div class="idiomas" role="group" data-t-attr="aria-label:idiomas">
          <button type="button" data-idioma="es" aria-pressed="true">ES</button>
          <button type="button" data-idioma="pt" aria-pressed="false">PT</button>
          <button type="button" data-idioma="en" aria-pressed="false">EN</button>
          <button id="tema" type="button" data-t="temaEscuro">Modo oscuro</button>
        </div>
      </div>
    </header>

    <main>
      <h1 data-t="titulo">Mi corretaje</h1>
      <p class="intro" data-t="intro"></p>

      <div class="card">
        <fieldset>
          <legend data-t="tipoNegocio">Tipo de negocio</legend>
          <div class="segmented">
            <label>
              <input type="radio" name="tipo" value="COMPRA" checked />
              <span data-t="venda">Venta</span>
            </label>
            <label>
              <input type="radio" name="tipo" value="ALUGUEL" />
              <span data-t="aluguel">Alquiler</span>
            </label>
          </div>
        </fieldset>

        <label class="dois-lados" id="captacaoCampo" hidden>
          <input type="checkbox" id="captacao" />
          <span>
            <span class="dois-lados-titulo" data-t="captacaoLabel"></span>
            <span class="dois-lados-dica" data-t="captacaoDica"></span>
          </span>
        </label>

        <label class="dois-lados" id="doisLadosCampo" hidden>
          <input type="checkbox" id="doisLados" />
          <span>
            <span class="dois-lados-titulo" data-t="doisLadosLabel"></span>
            <span class="dois-lados-dica" data-t="doisLadosDica"></span>
          </span>
        </label>

        <div class="row">
          <div>
            <label class="label" for="valor" id="valorRotulo"></label>
            <input
              id="valor"
              type="text"
              inputmode="decimal"
              autocomplete="off"
              placeholder="350.000"
            />
          </div>
          <div>
            <label class="label" for="moeda" data-t="moeda">Moneda</label>
            <select id="moeda">
              <option value="USD"></option>
              <option value="PYG"></option>
              <option value="BRL"></option>
            </select>
          </div>
        </div>

        <p class="erro" id="erro" hidden></p>
      </div>

      <div class="card">
        <p class="resultado-rotulo" id="resultadoRotulo"></p>
        <p class="resultado" id="resultado">—</p>
        <div class="cascata" id="cascata" hidden>
          <dl id="listaCascata"></dl>
        </div>
        <div class="equivalencias" id="equivalencias" hidden>
          <span class="resultado-rotulo" data-t="equivaleA"></span>
          <dl id="listaEquivalencias"></dl>
        </div>
      </div>

      <div class="card cotacoes-info">
        <div class="cotacoes-linha">
          <span class="resultado-rotulo" data-t="cotacoesTitulo"></span>
          <span class="cotacoes-carimbo" id="cotacoesCarimbo"></span>
        </div>
        <div class="cotacoes-linha">
          <span data-t="dolarEmGuarani"></span>
          <span class="cotacoes-par" id="parPyg">—</span>
        </div>
        <div class="cotacoes-linha">
          <span data-t="dolarEmReal"></span>
          <span class="cotacoes-par" id="parBrl">—</span>
        </div>
        <p class="nota" id="cotacoesNota"></p>
      </div>
    </main>

    <footer id="rodape"></footer>

      var idioma = IDIOMA_PADRAO;
      var cotacoes = COTACOES_RESERVA;
      var cotacoesCompletas = null;

      function t(chave) {
        return TEXTOS[idioma][chave];
      }
      function preencher(texto, valores) {
        return texto.replace(/\{(\w+)\}/g, function (_, chave) {
          return valores[chave] != null ? valores[chave] : "";
        });
      }

      // localStorage pode estar bloqueado (aba anônima, cookies desligados).
      function lerLocal(chave) {
        try {
          return window.localStorage.getItem(chave);
        } catch (e) {
          return null;
        }
      }
      function gravarLocal(chave, valor) {
        try {
          window.localStorage.setItem(chave, valor);
        } catch (e) {
          /* segue sem lembrar a escolha */
        }
      }

      var el = function (id) {
        return document.getElementById(id);
      };
      var elValor = el("valor");
      var elValorRotulo = el("valorRotulo");
      var elDoisLados = el("doisLados");
      var elDoisLadosCampo = el("doisLadosCampo");
      var elCaptacao = el("captacao");
      var elCaptacaoCampo = el("captacaoCampo");
      var elMoeda = el("moeda");
      var elErro = el("erro");
      var elResultado = el("resultado");
      var elResultadoRotulo = el("resultadoRotulo");
      var elCascata = el("cascata");
      var elListaCascata = el("listaCascata");
      var elEquivalencias = el("equivalencias");
      var elLista = el("listaEquivalencias");
      var elTema = el("tema");

      // Aceita "350.000", "2.750,80" e "350000.50", ignorando símbolos de
      // moeda colados no valor.
      function lerValor(bruto) {
        var limpo = bruto.replace(/[^\d.,-]/g, "").trim();
        if (!limpo) return null;

        var pontos = (limpo.match(/\./g) || []).length;
        var virgulas = (limpo.match(/,/g) || []).length;
        var normalizado;

        if (pontos > 0 && virgulas > 0) {
          normalizado =
            limpo.lastIndexOf(",") > limpo.lastIndexOf(".")
              ? limpo.replace(/\./g, "").replace(",", ".")
              : limpo.replace(/,/g, "");
        } else if (pontos > 1 || virgulas > 1) {
          normalizado = limpo.replace(/[.,]/g, "");
        } else if (pontos === 1 && /\.\d{3}$/.test(limpo)) {
          // "350.000" são trezentos e cinquenta mil, não 350.
          normalizado = limpo.replace(".", "");
        } else {
          normalizado = limpo.replace(",", ".");
        }

        var numero = Number(normalizado);
        if (!isFinite(numero) || numero < 0) return null;
        return numero;
      }

      function numero(valor, casas) {
        return valor.toLocaleString(LOCALES[idioma], {
          minimumFractionDigits: casas,
          maximumFractionDigits: casas,
        });
      }
      function formatar(valor, moeda) {
        return SIMBOLOS[moeda] + " " + numero(valor, moeda === "PYG" ? 0 : 2);
      }
      function taxa(valor) {
        return (
          (valor * 100).toLocaleString(LOCALES[idioma], {
            maximumFractionDigits: 2,
          }) + "%"
        );
      }

      function converter(valor, de, para) {
        if (de === para) return valor;
        var emDolar = {
          USD: 1,
          PYG: 1 / cotacoes.usdToPyg,
          BRL: 1 / cotacoes.usdToBrl,
        };
        var doDolar = {
          USD: 1,
          PYG: cotacoes.usdToPyg,
          BRL: cotacoes.usdToBrl,
        };
        return valor * emDolar[de] * doDolar[para];
      }

      function tipoAtual() {
        return document.querySelector('input[name="tipo"]:checked').value;
      }
      // Só o aluguel tem dois lados: o dono e o inquilino pagam 50% de um
      // aluguel cada um. Numa venda a comissão sai inteira da compra.
      function lados() {
        return tipoAtual() === "ALUGUEL" && elDoisLados.checked ? 2 : 1;
      }

      function fatiaDoCorretor() {
        return REPASSES.reduce(function (resto, r) {
          return resto * (1 - r.taxa);
        }, 1);
      }

      function linhaCascata(rotulo, valorTexto, classe) {
        var bloco = document.createElement("div");
        if (classe) bloco.className = classe;
        var dt = document.createElement("dt");
        dt.textContent = rotulo;
        var dd = document.createElement("dd");
        dd.textContent = valorTexto;
        bloco.appendChild(dt);
        bloco.appendChild(dd);
        elListaCascata.appendChild(bloco);
      }

      function calcular() {
        var tipo = tipoAtual();
        var moeda = elMoeda.value;
        var bruto = elValor.value;
        var valor = lerValor(bruto);

        elDoisLadosCampo.hidden = tipo !== "ALUGUEL";
        elCaptacaoCampo.hidden = tipo !== "COMPRA";
        var quantosLados = lados();

        elValorRotulo.textContent =
          tipo === "ALUGUEL" ? t("valorAluguel") : t("valorVenda");
        elResultadoRotulo.textContent = preencher(t("quantoFica"), {
          fatia: taxa(fatiaDoCorretor()),
        });
        elErro.textContent = t("erro");
        elErro.hidden = !(bruto.trim() !== "" && valor === null);

        if (valor === null) {
          elResultado.textContent = "—";
          elCascata.hidden = true;
          elEquivalencias.hidden = true;
          return;
        }

        var comissao = valor * TAXAS[tipo] * quantosLados;

        elListaCascata.textContent = "";
        linhaCascata(
          t("comissaoDoNegocio") +
            " — " +
            t("regras")[tipo] +
            (quantosLados === 2 ? " × 2 (" + t("doisLadosCurto") + ")" : ""),
          formatar(comissao, moeda),
        );

        // Captação de imóvel à venda: a comissão do negócio é limitada. O
        // teto está em guaranis, então vira a moeda da tela antes de comparar.
        if (tipo === "COMPRA" && elCaptacao.checked) {
          var teto = converter(TETO_CAPTACAO_PYG, "PYG", moeda);
          if (comissao > teto) {
            comissao = teto;
            linhaCascata(
              t("tetoCaptacao") + " — " + formatar(TETO_CAPTACAO_PYG, "PYG"),
              formatar(teto, moeda),
              "teto",
            );
          }
        }

        var saldo = comissao;
        REPASSES.forEach(function (repasse, indice) {
          var parte = saldo * repasse.taxa;
          linhaCascata(
            repasse.rotulo +
              " — " +
              taxa(repasse.taxa) +
              (indice === 0 ? "" : " " + t("doSaldo")),
            "− " + formatar(parte, moeda),
            "repasse",
          );
          saldo -= parte;
        });

        var liquido = saldo;
        linhaCascata(t("suaCorretagem"), formatar(liquido, moeda), "liquido");
        elCascata.hidden = false;
        elResultado.textContent = formatar(liquido, moeda);

        elLista.textContent = "";
        MOEDAS.filter(function (codigo) {
          return codigo !== moeda;
        }).forEach(function (codigo) {
          var linha = document.createElement("div");
          var dt = document.createElement("dt");
          dt.textContent = t("moedas")[codigo];
          var dd = document.createElement("dd");
          dd.textContent = formatar(converter(liquido, moeda, codigo), codigo);
          linha.appendChild(dt);
          linha.appendChild(dd);
          elLista.appendChild(linha);
        });
        elEquivalencias.hidden = false;
      }

      function mostrarCotacoes() {
        el("parPyg").textContent = formatar(cotacoes.usdToPyg, "PYG");
        el("parBrl").textContent = formatar(cotacoes.usdToBrl, "BRL");

        if (cotacoesCompletas) {
          el("cotacoesCarimbo").textContent = preencher(t("carimbo"), {
            quando: cotacoesCompletas.publicadoEm || "",
          });
          el("cotacoesNota").textContent = preencher(t("cotacoesNota"), {
            fonte: "brascambio.com.py",
            gsPorReal: numero(cotacoesCompletas.gsPorReal.transferencia, 0),
            reaisPorDolar: numero(cotacoesCompletas.reaisPorDolar, 2),
          });
        } else {
          el("cotacoesCarimbo").textContent = "";
          el("cotacoesNota").textContent = t("cotacoesReserva");
        }
      }

      function aplicarIdioma(novo) {
        idioma = IDIOMAS.indexOf(novo) === -1 ? IDIOMA_PADRAO : novo;
        document.documentElement.lang = idioma;

        document.querySelectorAll("[data-t]").forEach(function (no) {
          var valor = t(no.getAttribute("data-t"));
          if (typeof valor === "string") no.textContent = valor;
        });
        document.querySelectorAll("[data-t-attr]").forEach(function (no) {
          var partes = no.getAttribute("data-t-attr").split(":");
          no.setAttribute(partes[0], t(partes[1]));
        });

        Array.prototype.forEach.call(elMoeda.options, function (opcao) {
          opcao.textContent = t("moedas")[opcao.value];
        });

        el("rodape").textContent = t("rodape");
        elTema.textContent =
          document.documentElement.getAttribute("data-theme") === "dark"
            ? t("temaClaro")
            : t("temaEscuro");

        document.querySelectorAll("[data-idioma]").forEach(function (botao) {
          botao.setAttribute(
            "aria-pressed",
            String(botao.getAttribute("data-idioma") === idioma),
          );
        });

        mostrarCotacoes();
        calcular();
      }

      function aplicarTema(tema) {
        document.documentElement.setAttribute("data-theme", tema);
        elTema.textContent = tema === "dark" ? t("temaClaro") : t("temaEscuro");
      }

      // Cotações: o navegador não pode buscar o Brascambio direto (outro
      // domínio, sem CORS), então lê o arquivo que o GitHub Actions gera a
      // cada publicação, servido pelo mesmo endereço desta página.
      function carregarCotacoes() {
        return fetch("cotacoes.json", { cache: "no-cache" })
          .then(function (resposta) {
            if (!resposta.ok) throw new Error(String(resposta.status));
            return resposta.json();
          })
          .then(function (dados) {
            if (!(dados.usdToPyg > 0) || !(dados.usdToBrl > 0)) {
              throw new Error("cotações inválidas");
            }
            cotacoesCompletas = dados;
            cotacoes = { usdToPyg: dados.usdToPyg, usdToBrl: dados.usdToBrl };
          })
          .catch(function () {
            cotacoesCompletas = null;
            cotacoes = COTACOES_RESERVA;
          })
          .then(function () {
            mostrarCotacoes();
            calcular();
          });
      }

      // Partida ----------------------------------------------------------
      var temaSalvo = lerLocal(CHAVE_TEMA);
      var prefereEscuro =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute(
        "data-theme",
        temaSalvo || (prefereEscuro ? "dark" : "light"),
      );

      aplicarIdioma(lerLocal(CHAVE_IDIOMA) || IDIOMA_PADRAO);
      carregarCotacoes();

      elValor.addEventListener("input", calcular);
      elDoisLados.addEventListener("change", calcular);
      elCaptacao.addEventListener("change", calcular);
      elMoeda.addEventListener("change", calcular);
      document.querySelectorAll('input[name="tipo"]').forEach(function (radio) {
        radio.addEventListener("change", calcular);
      });
      document.querySelectorAll("[data-idioma]").forEach(function (botao) {
        botao.addEventListener("click", function () {
          var novo = botao.getAttribute("data-idioma");
          gravarLocal(CHAVE_IDIOMA, novo);
          aplicarIdioma(novo);
        });
      });
      elTema.addEventListener("click", function () {
        var novo =
          document.documentElement.getAttribute("data-theme") === "dark"
            ? "light"
            : "dark";
        aplicarTema(novo);
        gravarLocal(CHAVE_TEMA, novo);
      });
    </script>
  </body>
</html>
